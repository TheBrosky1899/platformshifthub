[project]
name = "platformshifthub"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "TheBrosky1899", email = "136100204+TheBrosky1899@users.noreply.github.com"},
]
dependencies = [
    "aws-cdk-lib==2.202.0",
    "constructs<11.0.0,>=10.0.0",
    "streamlit[auth]>=1.50.0",
    "watchdog>=6.0.0",
    "pandas>=2.3.3",
    "boto3>=1.40.55",
    "mypy-boto3-s3>=1.40.26",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
start = "streamlit run src/main.py"